# Broker do badań: ustawienia jak w ../mosquitto/mosquitto.conf, ale bez haseł i ACL
# (uwierzytelnianie nie wpływa na mierzone opóźnienia, a upraszcza uruchomienie).
listener 1883
allow_anonymous true

# Trwałe sesje: wiadomości QoS 1 dla rozłączonego backendu (clean_session=False) czekają u brokera
persistence true
persistence_location /mosquitto/data/
max_queued_messages 100000

# Backend potwierdza wiadomości dopiero po zapisie do bazy (manual_ack) – jak w ../mosquitto/mosquitto.conf.
# (Przebiegi "przed poprawkami" używały domyślnego 20; przy automatycznym potwierdzaniu nie miało to znaczenia.)
max_inflight_messages 1000
