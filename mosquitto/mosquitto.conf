listener 1883

# Uwierzytelnianie: plik haseł tworzony przy starcie kontenera z zmiennych .env (docker-compose.yml)
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Trwałe sesje: wiadomości QoS 1 dla rozłączonego backendu (clean_session=False) czekają u brokera
persistence true
persistence_location /mosquitto/data/
max_queued_messages 100000
